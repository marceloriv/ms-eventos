# H2 in-memory (reemplaza MySQL en tests)
spring.datasource.url=jdbc:h2:mem:eventosdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Desactiva config-server, Eureka y rabbitmq en tests
spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false

# JWT para tests
jwt.secret=clave-secreta-de-test-para-unit-tests-32c
